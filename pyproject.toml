[project]
name = "dockschedule"
version = "0.1.0"
description = "Classroom virtual screening with QuickVina"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1", "itsdangerous>=2.2",
  "redis>=5,<7", "rq>=2.1,<3", "psutil>=6,<8",
  "rdkit>=2024.9", "openmm==8.2.0", "pdbfixer", "meeko>=0.6,<0.8",
  "gemmi>=0.6", "scipy>=1.14", "openbabel-wheel>=3.1.1",
  "zipstream-ng>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dockschedule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real toolchain and services", "scale: large data checks"]
